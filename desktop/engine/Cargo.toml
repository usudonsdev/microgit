[package]
name = "engine"
description = "verEve デスクトップ(非エンジニア版)の履歴エンジン"
publish = false
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vereve-desk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
fastcdc = "5.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
notify = "9.0.0"
percent-encoding = "2.3.2"
preflate-rs = "=0.7.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"
zstd = "0.14.4"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
